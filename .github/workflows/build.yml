name: build

# Manual only. PR CI runs analyze and test; run this when a change needs a real
# Android or iOS build, and for the template done check.
on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - run: flutter --version
      - run: flutter build apk --debug --flavor dev --dart-define-from-file=config/dev.json
      - run: flutter build apk --debug --flavor prod --dart-define-from-file=config/prod.json
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: build/app/outputs/flutter-apk/*.apk

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - run: flutter build ios --no-codesign --debug --simulator --flavor dev --dart-define-from-file=config/dev.json
      - run: flutter build ios --no-codesign --flavor dev --dart-define-from-file=config/dev.json
      - run: flutter build ios --no-codesign --flavor stage --dart-define-from-file=config/stage.json
      - run: /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" -c "Print :CFBundleDisplayName" build/ios/iphoneos/Runner.app/Info.plist
